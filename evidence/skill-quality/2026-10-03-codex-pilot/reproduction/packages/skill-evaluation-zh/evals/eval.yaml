schema_version: v1alpha1

environment:
  type: none

skills:
  - source: local_path
    path: .
    target: .agents/skills/skill-evaluation

engine:
  name: codex_no_daemon_isolated
  model: {provider: openai, name: gpt-6.1-sol}
  custom:
    transport: local
    response_format: session_result
    local:
      command: node
      args: ["${SQET_ADAPTER}", "${input_file}"]

cases:
  files:
    - evals/cases/basic-success.yaml
    - evals/cases/edge-incomplete-input.yaml
    - evals/cases/edge-no-second-engine.yaml
  defaults:
    timeout_seconds: 900
    max_turns: 8
    expect:
      exit_code: 0

report:
  formats: [json]
