schema_version: v1alpha1

environment:
  type: none

skills:
  - source: local_path
    path: .
    target: .agents/skills/performance-testing

engine:
  name: codex_no_daemon_isolated
  model: {provider: openai, name: gpt-6.1-sol}
  custom:
    transport: local
    response_format: session_result
    local:
      command: node
      args: ["${SQET_ADAPTER}", "${input_file}"]
  # model is optional; omit to use engine default
  # model:
  #   provider: anthropic
  #   name: claude-sonnet-4-6

cases:
  files:
    - evals/cases/basic-success.yaml
    - evals/cases/edge-incomplete-input.yaml
    - evals/cases/edge-domain-boundary.yaml
  defaults:
    timeout_seconds: 900
    max_turns: 8
    expect:
      exit_code: 0
      must_not_contain:
        - "TODO"

report:
  formats: [json]
