id: testability-analysis-positive
title: 正向金样（期望 PASS）
input:
  prompt: "评审以下架构的可测试性并给出可执行的改进与验证方案：订单服务通过消息队列调用支付适配器，适配器依赖外部支付商；沙箱有回调模拟器，没有故障注入入口，消息队列可配置隔离主题。请分析组件与异步边界、测试接缝、替身策略、隔离、故障注入、环境复现、可观察性、可控制性、确定性及证据缺口。区分输入事实和待核验判断，保留成本、优先级、人类决策和残余风险；没有执行记录时不能声称方案有效。"
judge:
  type: agent_judge
  model: openai/gpt-6-sol
  timeout_seconds: 600
  criteria:
    - "判断引用输入中的组件边界、异步拓扑和现有/缺失能力，区分事实、假设与证据缺口。"
    - "覆盖接缝、替身、隔离、故障注入和环境复现，并保留可观察性、可控制性、确定性和数据准备。"
    - "使用隔离和最小权限的验证方案，不削弱生产鉴权、租户隔离或资金安全。"
    - "改进项具有风险优先级、价值/成本、验证刺激、预期判断和可追踪证据。"
    - "标注有效性未验证、环境/替身残余风险、停止条件及负责人或人类决策，不凭模拟器存在宣布通过。"
  pass_threshold: 0.8
